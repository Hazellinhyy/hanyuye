spring.application.name=cat-adoption-system
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/cat_adoption_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.mvc.async.request-timeout=300000
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

recognition.model.enabled=${RECOGNITION_MODEL_ENABLED:false}
recognition.model.endpoint=${RECOGNITION_MODEL_ENDPOINT:http://localhost:9000/v1/image-embedding}
recognition.model.api-key=${RECOGNITION_MODEL_API_KEY:}
recognition.model.model-name=${RECOGNITION_MODEL_NAME:openai/clip-vit-base-patch32}
recognition.model.connect-timeout-millis=${RECOGNITION_MODEL_CONNECT_TIMEOUT:2500}
recognition.model.read-timeout-millis=${RECOGNITION_MODEL_READ_TIMEOUT:8000}
recognition.model.fallback-to-local=${RECOGNITION_MODEL_FALLBACK_TO_LOCAL:true}

agent.local.enabled=${LOCAL_AGENT_ENABLED:true}
agent.local.endpoint=${LOCAL_AGENT_ENDPOINT:http://127.0.0.1:9100/v1/chat/completions}
agent.local.model=${LOCAL_AGENT_MODEL:gemma-4-E2B-it-UD-IQ2_M}

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-handlers-package=com.hfut.cat_adoption_system.mapper.type
